[project]
name = "am-language"
version = "0.1.2"
description = "AM programming language by Anuj Mishra: Python syntax, Python libraries, fewer Python bugs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anuj Mishra" }]
requires-python = ">=3.9"
keywords = ["am", "am language", "programming language", "python", "beginners", "education", "anuj mishra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://chaman640.github.io/Python-based-language.am/"
Source = "https://github.com/chaman640/Python-based-language.am"
"VS Code extension" = "https://marketplace.visualstudio.com/items?itemName=chaman640.am-language"
Issues = "https://github.com/chaman640/Python-based-language.am/issues"

[project.scripts]
am = "amlang.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amlang"]

