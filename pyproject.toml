[project]
name = "am-lang"
version = "0.1.0"
description = "AM: Python syntax, Python libraries, fewer Python bugs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "chaman640" }]
requires-python = ">=3.9"
keywords = ["language", "python", "beginners", "education", "transpiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/chaman640/Python-based-language.am"
Issues = "https://github.com/chaman640/Python-based-language.am/issues"

[project.scripts]
am = "amlang.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amlang"]

