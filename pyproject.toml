[project]
name = "amlang"
version = "0.1.0"
description = "AM: Python syntax, Python libraries, fewer Python bugs"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
am = "amlang.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amlang"]
