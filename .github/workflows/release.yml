name: release
# Runs when a release is published on GitHub (Releases -> Draft a new release).
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI "trusted publishing": no password or token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach the .vsix to the release
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @vscode/vsce package
      - run: gh release upload "$TAG" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

      # VS Code Marketplace. Needs the repository secret VSCE_PAT (see docs/ROADMAP.md).
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set, skipping the VS Code Marketplace"
            exit 0
          fi
          npx -y @vscode/vsce publish --packagePath *.vsix

      # Open VSX (used by VSCodium, Cursor and others). Optional secret OVSX_PAT.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Optional OVSX_PAT secret is not set, skipping Open VSX"
            exit 0
          fi
          npx -y ovsx publish *.vsix
